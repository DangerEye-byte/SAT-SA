<!doctype html>
<html lang="en" class="cds--g10" data-theme="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" />
    <title>SAT-SA · Supervisory Analytics</title>
    <script>
      // Light by default, whatever the OS theme. Dark only after the user picks it (saved choice).
      try {
        if (localStorage.getItem("satsa-theme-choice") === "dark") {
          document.documentElement.className = "cds--g100";
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
